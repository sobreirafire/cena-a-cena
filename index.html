<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cena a Cena</title>
<meta name="theme-color" content="#0E1222">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cena a Cena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior fixa + coluna central; a "tela de cinema" escura é o bloco de destaque, o resto é claro e calmo. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --ink:#141A2E; --muted:#596079; --line:#D8DCE6; --chip:#E4E8F1;
  --accent:#E2492F; --accent-ink:#FFFFFF; --sub:#F5C542; --sub-ink:#1B1608;
  --good:#1D8F5A; --good-bg:#DDF3E8; --bad:#C93535; --bad-bg:#FBE3E1;
  --screen:#0E1222; --screen-ink:#F4F1E8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C101D; --surface:#151A2C; --ink:#E8EBF4; --muted:#9AA1B8; --line:#262D45; --chip:#1F263B;
  --accent:#FF6A4D; --accent-ink:#1A0A06; --good:#45C486; --good-bg:#12321F; --bad:#FF7B73; --bad-bg:#3A1716;
  --screen:#05070F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C101D; --surface:#151A2C; --ink:#E8EBF4; --muted:#9AA1B8; --line:#262D45; --chip:#1F263B;
  --accent:#FF6A4D; --accent-ink:#1A0A06; --good:#45C486; --good-bg:#12321F; --bad:#FF7B73; --bad-bg:#3A1716;
  --screen:#05070F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .clap{width:30px;height:24px;border-radius:4px;background:var(--screen);position:relative;overflow:hidden}
.brand .clap::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(-45deg,var(--screen-ink) 0 5px,var(--screen) 5px 10px)}
.brand .clap::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:2px;background:var(--sub)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.nav a.on,.nav a:hover{background:var(--chip);color:var(--ink)}
main{padding-block:24px calc(64px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);flex:none}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.rec.live{animation:pulse 1.1s infinite}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--bad) 25%,transparent)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ico{width:16px;height:16px;flex:none}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;font-size:14px}
.banner b{color:var(--accent)}
/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end;margin-bottom:24px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.03em;margin-top:8px}
.hero p{max-width:58ch;margin:12px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 14px}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);line-height:1.3}
.stat.big .n{color:var(--accent)}
.method{display:grid;grid-template-columns:repeat(9,1fr);margin:8px 0 30px;position:relative}
.method::before{content:"";position:absolute;left:5%;right:5%;top:17px;height:2px;background:var(--line)}
.mstep{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;font-size:12.5px;line-height:1.25;padding:0 3px}
.mstep .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-weight:600;font-size:13px}
.mstep.end .dot{background:var(--accent);color:var(--accent-ink)}
.lvhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.lvhead h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.lcard h3{font-size:21px}
.lcard .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pip{flex:1;height:6px;border-radius:3px;background:var(--chip)}
.pip.on{background:var(--good)}
.lcard .row{margin-top:auto}
.newcard{border-style:dashed;background:transparent}
.month{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px}
.month>summary{cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;list-style:none}
.month>summary::-webkit-details-marker{display:none}
.month>summary::before{content:"▸";color:var(--accent);font-weight:800}
.month[open]>summary::before{content:"▾"}
.mname{font-family:var(--f-display);font-weight:800;font-size:20px}
.week{padding:4px 18px 16px}
.wk{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.wk.now{color:var(--accent);font-weight:600}
.tagline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip)}
.tagline.warn{background:color-mix(in srgb,var(--sub) 35%,var(--surface))}
.tagline.ok{background:var(--good-bg);color:var(--good)}
/* lesson */
.lhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.lhead h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.stepper a{flex:0 0 auto;min-width:100px;display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--muted);font-size:12.5px;line-height:1.2;scroll-snap-align:start}
.stepper a .k{font-family:var(--f-mono);font-weight:600;font-size:12px;display:flex;justify-content:space-between;color:var(--ink)}
.stepper a .k .ok{color:var(--good)}
.stepper a.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stepper a.on .k{color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel>h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.panel>.lead{margin:6px 0 18px;color:var(--muted);max-width:68ch}
.tip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
/* screen */
.player{border-radius:12px;overflow:hidden;background:#000;max-width:100%}
.player:fullscreen{display:flex;flex-direction:column;border-radius:0}
.player:fullscreen .screen{flex:1;aspect-ratio:auto;border-radius:0}
.screen{position:relative;background:#000;color:var(--screen-ink);border-radius:12px;aspect-ratio:16/9;max-width:100%;overflow:hidden;--fx:0px;--fy:0px;--fw:100%;--fh:100%;--mh:.22}
.player .screen{border-radius:0}
.screen video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* tarja opcional que cobre legendas gravadas na imagem */
.ytwrap{position:absolute;inset:0}
.ytwrap iframe,.ytwrap>div{width:100%;height:100%;border:0;display:block}
.tapmsg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;pointer-events:none;max-width:90%;text-align:center}
.mask{position:absolute;left:var(--fx);width:var(--fw);top:calc(var(--fy) + var(--fh) * (1 - var(--mh)));height:calc(var(--fh) * var(--mh));background:rgba(6,8,16,.93);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);pointer-events:none}
.subs{position:absolute;left:var(--fx);width:var(--fw);top:calc(var(--fy) + var(--fh) * (1 - var(--mh)));height:calc(var(--fh) * var(--mh));padding:0 4%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;pointer-events:none;align-items:center}
.screen.nomask .subs{top:auto;height:auto;bottom:calc(var(--fh) * .16)}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0b0e18;color:#fff}
.bar button{border:0;background:transparent;color:#fff;cursor:pointer;min-width:40px;min-height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px}
.bar button:hover{background:rgba(255,255,255,.12)}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--sub)}
.bar .time{font-family:var(--f-mono);font-size:12px;opacity:.8;white-space:nowrap}
.maskrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#141826;color:#fff;font-size:13px;flex-wrap:wrap}
.maskrow input{flex:1;min-width:120px;accent-color:var(--sub)}
.subs span{display:inline;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.55);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.subs .en{font-weight:700;font-size:clamp(14px,2.6vw,24px);color:var(--sub)}
.subs .pt{font-size:clamp(13px,2.2vw,20px);color:#fff}
.screen:fullscreen .subs .en{font-size:clamp(20px,3vw,40px)} .screen:fullscreen .subs .pt{font-size:clamp(18px,2.6vw,34px)}
.screen .recdot{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:12px;background:var(--bad);color:#fff;padding:3px 9px;border-radius:6px}
.screen .err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;font-size:15px;background:rgba(0,0,0,.75)}
.under{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);min-height:34px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* quiz */
.q{font-weight:700;font-size:18px;margin-bottom:10px}
.qpt{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.opt .t{flex:1;min-width:0}
.opt .pt{font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
/* lines */
.lines{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
.line{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.line .sp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.line .pt{font-size:13.5px;color:var(--muted)}
.line.cur{border-color:var(--sub);background:color-mix(in srgb,var(--sub) 16%,var(--surface))}
.line.done{border-left:4px solid var(--good)}
.line.skip{opacity:.5}
.line .sc{float:right;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--good)}
.focus-line{background:var(--sub);color:var(--sub-ink);border-radius:12px;padding:14px 16px;font-weight:700;font-size:19px;text-align:center;margin:12px 0 6px}
.focus-pt{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.heard{min-height:3em;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px}
.heard .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:block;margin-bottom:4px}
.w{display:inline-block;padding:0 3px;border-radius:4px;margin:1px 0}
.w.ok{background:var(--good-bg);color:var(--good);font-weight:700}
.w.no{background:var(--bad-bg);color:var(--bad);text-decoration:underline dotted}
.pct{font-family:var(--f-display);font-weight:800;font-size:26px}
audio{width:100%;max-width:100%;margin-top:8px;height:40px}
/* marcação */
.hold{width:100%;min-height:96px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hold small{font-weight:400;font-size:13px;opacity:.75}
.hold.down{background:var(--bad);color:#fff}
.tc{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ditado */
.dict{font-size:19px;line-height:2.2;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.dict input{font-family:var(--f-mono);font-size:17px;border:0;border-bottom:2px solid var(--accent);background:transparent;padding:0 2px;text-align:center;letter-spacing:.12em;outline:none;max-width:100%}
.dict input.ok{border-color:var(--good);color:var(--good)}
.dict input.no{border-color:var(--bad);color:var(--bad)}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* karaoke */
.lyrics{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto}
.ly{padding:6px 10px;border-radius:8px;color:var(--muted)}
.ly .pt{font-size:13px}
.ly.cur{background:var(--sub);color:var(--sub-ink)}
.ly.cur .pt{color:var(--sub-ink);opacity:.8}
.kara{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center;background:linear-gradient(160deg,#1B1F6B,#3B1060)}
.kara .now{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4vw,40px);color:#fff}
.kara .next{font-size:clamp(14px,2.2vw,20px);color:#fff;opacity:.55}
.kara .ttl{font-family:var(--f-mono);font-size:12px;color:#fff;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
/* report */
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.az .letter{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);border-bottom:1px solid var(--line);margin-bottom:4px}
.az button{display:block;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;font-size:15px}
.az button:hover{color:var(--accent)}
.az .c{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;background:var(--surface);cursor:pointer}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin:14px 0 22px}
.scores div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scores .n{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.scores .l{font-size:12.5px;color:var(--muted)}
.vick{display:flex;gap:16px;align-items:center;background:var(--screen);color:var(--screen-ink);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;flex-wrap:wrap}
.vick .n{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,64px);color:var(--sub);line-height:1;font-variant-numeric:tabular-nums}
/* editor */
.form{display:grid;gap:18px}
.fgroup{display:grid;gap:6px;min-width:0}
.fgroup label{font-weight:700;font-size:14px}
.fgroup .help{font-size:13px;color:var(--muted)}
.form input[type=text],.form input[type=url],.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px}
.form textarea{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;min-height:180px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:18px;padding:0 6px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--chip);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.credit{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .bar{gap:2px;padding:4px 6px}
  .bar button{min-width:36px}
  .method{grid-template-columns:repeat(5,1fr);row-gap:16px}
  .method::before{display:none}
}
@media (max-width:480px){
  .panel{padding:16px} .panel>h2{font-size:22px}

<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const ICON = {
  play: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  stop: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',

  ear: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  next: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  full: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
};
const ic = (n) => h('span', { html: ICON[n], style: 'display:inline-flex' });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
function fmtTime(s) { if (s == null) return '—'; const m = Math.floor(s / 60); const r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }
function parseTime(str) { if (!str) return null; const p = str.trim().replace(',', '.').split(':').map(Number); if (p.some(isNaN)) return null; return p.reduce((a, b) => a * 60 + b, 0); }
const LS = {
  get(k, d) { try { const v = localStorage.getItem('cac_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cac_' + k, JSON.stringify(v)); } catch (e) {} },
  keys() { try { return Object.keys(localStorage).filter(k => k.startsWith('cac_')).map(k => k.slice(4)); } catch (e) { return []; } }
};
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

/* ================= banco local (aulas criadas por você) ================= */
const DB = {
  db: null, mem: new Map(),
  async open() {
    try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('cena-a-cena', 1); r.onupgradeneeded = () => r.result.createObjectStore('lessons', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    catch (e) { this.db = null; }
  },
  _req(mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction('lessons', mode); const r = fn(tx.objectStore('lessons')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  async all() { if (!this.db) return [...this.mem.values()]; try { return await this._req('readonly', s => s.getAll()); } catch (e) { return [...this.mem.values()]; } },
  async put(l) { this.mem.set(l.id, l); if (this.db) try { await this._req('readwrite', s => s.put(l)); } catch (e) { toast('Não consegui salvar no navegador.'); } },
  async del(id) { this.mem.delete(id); if (this.db) try { await this._req('readwrite', s => s.delete(id)); } catch (e) {} }
};

/* ================= progresso ================= */
const Progress = {
  d: LS.get('progress2', { lessons: {}, words: {}, missed: {}, total: 0, days: [] }),
  save() { LS.set('progress2', this.d); },
  L(id) { return this.d.lessons[id] || (this.d.lessons[id] = { done: {}, scores: {}, words: {}, missed: {}, total: 0 }); },
  touchDay() { const t = today(); if (!this.d.days.includes(t)) { this.d.days.push(t); this.save(); } },
  mark(id, step, pct) { const L = this.L(id); L.done[step] = true; if (pct != null && !isNaN(pct)) L.scores[step] = Math.max(L.scores[step] || 0, Math.round(pct)); this.touchDay(); this.save(); },
  addSpoken(id, res) {
    const L = this.L(id);
    for (const w of res.words) for (const s of w.subs) {
      if (s.ok) { L.words[s.k] = (L.words[s.k] || 0) + 1; this.d.words[s.k] = (this.d.words[s.k] || 0) + 1; this.d.total++; L.total = (L.total || 0) + 1; }
      else { L.missed[s.k] = (L.missed[s.k] || 0) + 1; this.d.missed[s.k] = (this.d.missed[s.k] || 0) + 1; }
    }
    this.touchDay(); this.save();
  },
  streak() { const set = new Set(this.d.days); let n = 0; const d = new Date(); if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1); while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); } return n; },
  reset(id) { delete this.d.lessons[id]; this.save(); }
};

/* ================= voz sintetizada (só no papel do parceiro, atividade 8) ================= */
const Speech = {
  voices: [], rate: LS.get('rate', 0.92), voiceName: LS.get('voice', ''),
  init() { if (!('speechSynthesis' in window)) return; const load = () => { this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }; load(); speechSynthesis.onvoiceschanged = () => { load(); if (route.name === 'ajustes') render(); }; },
  ordered() { const us = this.voices.filter(v => /en[-_]US/i.test(v.lang)); const rest = this.voices.filter(v => !/en[-_]US/i.test(v.lang)); const p = a => (/(Google|Natural|Online|Samantha|Alex)/i.test(a.name) ? 0 : 1); return [...us.sort((a, b) => p(a) - p(b)), ...rest.sort((a, b) => p(a) - p(b))]; },
  voiceFor(speaker) { const list = this.ordered(); if (!list.length) return null; const chosen = list.find(v => v.name === this.voiceName) || list[0]; if (!speaker) return chosen; let x = 0; for (const c of speaker) x = (x * 31 + c.charCodeAt(0)) >>> 0; const pool = [chosen, ...list.filter(v => v !== chosen)].slice(0, 5); return pool[x % pool.length]; },
  say(text, speaker, rate) {
    return new Promise(res => {
      if (!('speechSynthesis' in window)) { res(); return; }
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US';
      const v = this.voiceFor(speaker); if (v) u.voice = v; u.rate = rate || this.rate;
      let done = false; const fin = () => { if (!done) { done = true; res(); } }; u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 140 / u.rate); speechSynthesis.speak(u);
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} }
};

/* ================= microfone: reconhecer e gravar ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream = null;
async function getMic() {
  if (micStream && micStream.getTracks().some(t => t.readyState === 'live')) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  return micStream;
}
function releaseMic() { if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } }
/* No celular, o reconhecimento de voz e a gravação disputam o microfone; lá usamos só o reconhecimento. */
const CAN_RECORD = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && (!IS_MOBILE || !SR);
async function capture({ maxMs = 15000, onInterim } = {}) {
  let mr = null, chunks = [], rec = null, finalText = '', interim = '', stopped = false;
  if (CAN_RECORD) { const stream = await getMic(); mr = new MediaRecorder(stream); mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); }; mr.start(); }
  else if (!SR) throw new Error('nomic');
  const recDone = new Promise(res => {
    if (!SR) { res(); return; }
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = !IS_MOBILE; rec.interimResults = true;
    let errored = false;
    rec.onresult = e => { interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += ' ' + r[0].transcript; else interim += r[0].transcript; } onInterim && onInterim((finalText + ' ' + interim).trim()); };
    rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { errored = true; toast('O navegador bloqueou o microfone. Libere nas configurações do site.'); } };
    rec.onend = () => { if (!stopped && !errored) { if (interim) { finalText += ' ' + interim; interim = ''; } try { rec.start(); return; } catch (e) {} } res(); };
    try { rec.start(); } catch (e) { res(); }
  });
  const blobP = new Promise(res => { if (!mr) { res(null); return; } mr.onstop = () => res(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })); });
  let timer;
  const ctl = { stop() { if (stopped) return; stopped = true; clearTimeout(timer); try { if (mr && mr.state !== 'inactive') mr.stop(); } catch (e) {} try { rec && rec.stop(); } catch (e) {} setTimeout(() => { try { rec && rec.abort(); } catch (e) {} }, 2500); } };
  ctl.done = Promise.all([blobP, recDone]).then(([blob]) => ({ blob, transcript: (finalText + ' ' + interim).trim() }));
  timer = setTimeout(() => ctl.stop(), maxMs);
  return ctl;
}

/* ================= correção de pronúncia ================= */
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function numWords(n) { if (n <= 20) return [NUM[n]]; if (n < 100) { const t = TENS[Math.floor(n / 10)], o = n % 10; return o ? [t, NUM[o]] : [t]; }
  if (n < 1000) { const hnd = Math.floor(n / 100), r = n % 100; return [NUM[hnd], 'hundred', ...(r ? ['and', ...numWords(r)] : [])]; } return [String(n)]; }
const CONTR = { wherere: ['where', 'are'], gotta: ['got', 'to'], ok: ['okay'], mm: ['mm'], um: ['um'] };
const keyOf = (w) => w.toLowerCase().replace(/[’'`]/g, '').replace(/[^a-z0-9]/g, '');
function tokens(s) {
  return s.toLowerCase().replace(/[’'`]/g, '').replace(/[-–—/:]/g, ' ').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean)
    .flatMap(t => /^\d+$/.test(t) ? numWords(+t) : (CONTR[t] || [t]));
}
function scoreSpeech(target, said) {
  const words = target.split(/\s+/).filter(Boolean).map(w => ({ w, subs: tokens(w).map(k => ({ k, ok: false })) }));
  const T = words.flatMap(x => x.subs); const S = tokens(said || '');
  const n = T.length, m = S.length; const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = T[i].k === S[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0; while (i < n && j < m) { if (T[i].k === S[j]) { T[i].ok = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  words.forEach(x => x.ok = x.subs.length > 0 && x.subs.every(s => s.ok));
  const hit = T.filter(x => x.ok).length;
  return { words, hit, total: n, pct: n ? hit / n * 100 : 0, said: said || '' };
}
const renderScored = (res) => h('div', null, res.words.map(x => [h('span', { class: 'w ' + (x.subs.length ? (x.ok ? 'ok' : 'no') : '') }, x.w), ' ']));

/* ================= formatos de texto ================= */
const reTimeRange = /^\[\s*([\d:.,]+)\s*-\s*([\d:.,]+)\s*\]\s*/;
const reTime = /^\[\s*([\d:.,]+)\s*\]\s*/;
const reSpeaker = /^([A-Za-zÀ-ÿ][\wÀ-ÿ .'-]{0,28}):\s+/;
function splitPt(s) { const i = s.indexOf('|'); return i < 0 ? [s.trim(), ''] : [s.slice(0, i).trim(), s.slice(i + 1).trim()]; }
function parseCues(text) {
  return text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => {
    let t0 = null, t1 = null, sp = '', m = l.match(reTimeRange);
    if (m) { t0 = parseTime(m[1]); t1 = parseTime(m[2]); l = l.slice(m[0].length); }
    m = l.match(reSpeaker); if (m) { sp = m[1].trim(); l = l.slice(m[0].length); }
    const [en, pt] = splitPt(l); return { t0, t1, speaker: sp, en, pt };
  }).filter(c => c.en);
}
const cuesToText = (cues) => cues.map(c => (c.t0 != null && c.t1 != null ? `[${fmtTime(c.t0)}-${fmtTime(c.t1)}] ` : '') + (c.speaker ? c.speaker + ': ' : '') + c.en + (c.pt ? ' | ' + c.pt : '')).join('\n');
function parseLyrics(text) { return text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => { let t = null; const m = l.match(reTime); if (m) { t = parseTime(m[1]); l = l.slice(m[0].length); } const [en, pt] = splitPt(l); return { t, en, pt }; }).filter(x => x.en); }
const lyricsToText = (ls) => ls.map(x => (x.t != null ? `[${fmtTime(x.t)}] ` : '') + x.en + (x.pt ? ' | ' + x.pt : '')).join('\n');
function parseSrt(text) { return text.replace(/\r/g, '').split(/\n\n+/).map(b => { const ls = b.trim().split('\n'); const ti = ls.findIndex(x => x.includes('-->')); if (ti < 0) return null; const [a, z] = ls[ti].split('-->').map(s => parseTime(s.trim().split(' ')[0])); return { t0: a, t1: z, text: ls.slice(ti + 1).join(' ').replace(/<[^>]+>/g, '').trim() }; }).filter(Boolean); }

/* ================= editor (aulas criadas por você) ================= */
function viewEditor(l) {

  let videoBlob = base.videoBlob || null, songBlob = base.songBlob || null;
  const f = (id, label, input, help) => h('div', { class: 'fgroup' }, h('label', { for: id }, label), input, help ? h('div', { class: 'help', html: help }) : null);
  const inp = (id, v, ph, type) => h('input', { type: type || 'text', id, value: v || '', placeholder: ph || '' });
  const ta = (id, v, ph, rows) => h('textarea', { id, placeholder: ph || '', rows: rows || 8 }, v || '');
  const title = inp('e-title', base.title, 'Ex.: Na cafeteria'); const sceneTitle = inp('e-scene', base.sceneTitle, 'Ex.: At the Coffee Shop'); const focus = inp('e-focus', base.focus, 'Ex.: pedidos com "Can I…"');

  const vInfo = h('span', { class: 'small muted' }); const showV = () => { vInfo.textContent = videoBlob ? `Arquivo anexado: ${videoBlob.name || 'vídeo'} (${(videoBlob.size / 1048576).toFixed(1)} MB)` : ''; };
  const vFile = h('input', { type: 'file', id: 'e-video', accept: 'video/*', onchange: e => { videoBlob = e.target.files[0] || videoBlob; showV(); } });
  const cues = ta('e-cues', cuesToText(base.cues), 'Emma: Can I have a large latte, please? | Pode me ver um latte grande, por favor?', 12);
  const srtEn = h('input', { type: 'file', accept: '.srt,.vtt', hidden: true, onchange: async e => { const s = parseSrt(await e.target.files[0].text()); cues.value = cuesToText(s.map(x => ({ t0: x.t0, t1: x.t1, speaker: '', en: x.text, pt: '' }))); toast(s.length + ' falas importadas'); } });
  const q = base.question || { options: [] };
  const qEn = inp('e-qen', q.en, 'What is happening in the scene?'); const qPt = inp('e-qpt', q.pt, 'O que está acontecendo na cena?');
  const qOpts = ta('e-qopts', (q.options || []).map(o => o.en + (o.pt ? ' | ' + o.pt : '')).join('\n'), 'Uma alternativa por linha: inglês | português', 4);
  const qCorrect = h('select', { id: 'e-qc' }, [0, 1, 2, 3, 4].map(i => h('option', { value: i, selected: i === (q.correct || 0) }, 'Alternativa ' + (i + 1))));
  const sTitle = inp('e-stitle', base.songTitle, 'Nome da música'); const sLines = ta('e-slines', lyricsToText(base.songLines || []), '[0:12.5] Verso em inglês | tradução', 6);
  const sFile = h('input', { type: 'file', id: 'e-sfile', accept: 'audio/*,video/*', onchange: e => { songBlob = e.target.files[0] || songBlob; } });
  const dSel = h('select', { id: 'e-dlg' }, Object.entries(DIALOGUES).map(([k, d]) => h('option', { value: k, selected: k === base.dialogue }, d.titlePt)));
  async function save() {
    const out = Object.assign({}, base, { title: title.value.trim() || 'Aula sem título', sceneTitle: sceneTitle.value.trim(), focus: focus.value.trim(), cues: parseCues(cues.value),
      video: vurl.value.trim() ? { sd: vurl.value.trim() } : null, videoBlob,
      question: { en: qEn.value.trim(), pt: qPt.value.trim(), options: qOpts.value.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const [en, pt] = splitPt(x); return { en, pt }; }), correct: +qCorrect.value },
      songTitle: sTitle.value.trim(), songLines: parseLyrics(sLines.value), songBlob, dialogue: dSel.value, order: base.order != null ? base.order : 1000 + Date.now() / 1e10 });
    if (!out.cues.length) { toast('Escreva pelo menos uma fala'); cues.focus(); return; }
    if (!out.video && !out.videoBlob) { toast('Anexe um vídeo ou cole o link de um .mp4'); return; }
    if (!out.songLines.length) { delete out.songLines; out.song = 'row'; }
    if (out.question.correct >= out.question.options.length) out.question.correct = 0;
    await DB.put(out); lessons = await loadLessons(); toast('Aula salva'); go(`aula-${out.id}-1`);
  }
  const delBtn = isNew ? null : h('button', { class: 'btn ghost', type: 'button', onclick: async (e) => { if (!e.currentTarget.dataset.c) { e.currentTarget.dataset.c = '1'; e.currentTarget.textContent = 'Toque de novo para apagar'; return; } await DB.del(base.id); Progress.reset(base.id); lessons = await loadLessons(); toast('Aula apagada'); go('home'); } }, 'Apagar aula');

      h('fieldset', null, h('legend', null, 'Vídeo e falas'),
        f('e-vurl', 'Link do vídeo (.mp4)', vurl, 'Um endereço que termine em .mp4. Links do YouTube não funcionam aqui.'),
        f('e-video', 'Ou um arquivo de vídeo do seu aparelho', vFile, 'O arquivo fica guardado só neste aparelho.'), vInfo,
        f('e-cues', 'Falas', cues, 'Uma fala por linha: <code>Personagem: frase em inglês | tradução</code>. Depois de salvar, marque os tempos na própria aula.'),

      h('div', { class: 'actions', style: 'border:0;padding-top:0' }, h('div', { class: 'row' }, h('a', { class: 'btn ghost', href: '#home' }, 'Cancelar'), delBtn), h('button', { class: 'btn primary', type: 'submit' }, 'Salvar aula'))));
